<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le Carnet — Scanner &amp; Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #E9DEC4;
    --ticket: #FBF6E9;
    --ink: #2A2018;
    --ink-soft: #5C4F3E;
    --navy: #1E2A44;
    --stamp-red: #A83A2C;
    --profit-green: #4B6650;
    --rule: rgba(42,32,24,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(0,0,0,0.03), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(0,0,0,0.03), transparent 40%);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    padding:0 0 60px;
  }
  header{
    padding:40px 24px 24px;
    text-align:center;
    border-bottom:3px double var(--ink);
  }
  header .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:0.25em;
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  header h1{
    font-family:'Special Elite', monospace;
    font-size:40px;
    margin:8px 0 6px;
  }
  header p{
    max-width:560px;
    margin:0 auto;
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.5;
  }

  .tabs{
    display:flex;
    justify-content:center;
    gap:0;
    margin:26px auto 0;
    max-width:560px;
    border:2px solid var(--ink);
  }
  .tab{
    flex:1;
    text-align:center;
    padding:12px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    cursor:pointer;
    background:var(--ticket);
    color:var(--ink-soft);
  }
  .tab + .tab{border-left:2px solid var(--ink);}
  .tab.active{background:var(--navy);color:var(--ticket);}

  main{max-width:780px;margin:0 auto;padding:32px 20px 0;}
  .panel{display:none;}
  .panel.active{display:block;}

  .search-wrap{
    display:flex;
    gap:0;
    border:2px solid var(--ink);
    background:var(--ticket);
    margin-bottom:10px;
  }
  .search-wrap input, .search-wrap select{
    flex:1;
    border:none;
    background:transparent;
    padding:13px 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13.5px;
    color:var(--ink);
    outline:none;
  }
  .search-wrap button{
    border:none;
    border-left:2px solid var(--ink);
    background:var(--navy);
    color:var(--ticket);
    padding:0 20px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .search-wrap button:hover{background:#2b3a5c;}

  .threshold-box{
    display:flex;
    gap:14px;
    align-items:center;
    font-family:'IBM Plex Mono', monospace;
